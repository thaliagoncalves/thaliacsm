<style id="app-style">/* Layout: one fixed "game screen". Left column = character HUD + portrait with dialogue box. Right column = tabbed menu (Status, Skills, Missões, Resultados, Me conheça, Contato). Single dark look on purpose, built from the warm browns of the illustration. */
:root {
  --bg: #1a1210;
  --bg-dot: #2b1e18;
  --panel: #2a1e19;
  --panel-2: #372822;
  --panel-3: #4a3524;
  --edge: #8a6446;
  --edge-soft: #55402f;
  --text: #f6ead8;
  --muted: #cdb89c;
  --gold: #f2b24c;
  --gold-deep: #c98a2b;
  --gold-ink: #2a1a08;
  --leaf: #8fbc72;
  --leaf-ink: #14200d;
  --coral: #f08a6a;
  --font-display: 'Pixelify Sans', 'Courier New', monospace;
  --font-body: 'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
h1, h2, h3, h4, p, ul, figure { margin: 0; }
ul { padding: 0; list-style: none; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; text-align: inherit; }
:focus-visible { outline: 3px dashed var(--gold); outline-offset: 3px; }

body {
  margin: 0;
  background-color: var(--bg);
  background-image: radial-gradient(var(--bg-dot) 1.5px, transparent 1.6px);
  background-size: 12px 12px;
  color: var(--text);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
}

.stage { max-width: 1180px; margin-inline: auto; padding-inline: 16px; padding-block: 16px 40px; display: grid; gap: 18px; }

/* pixel panels: stepped corners made from four offset shadows */
.px {
  margin: 4px;
  background: var(--panel);
  box-shadow:
    0 -4px 0 0 var(--edge), 0 4px 0 0 var(--edge), -4px 0 0 0 var(--edge), 4px 0 0 0 var(--edge),
    inset -4px -4px 0 0 rgba(0, 0, 0, .28), inset 4px 4px 0 0 rgba(255, 255, 255, .04);
}
.px2 {
  margin: 2px;
  background: var(--panel-2);
  box-shadow: 0 -2px 0 0 var(--edge-soft), 0 2px 0 0 var(--edge-soft), -2px 0 0 0 var(--edge-soft), 2px 0 0 0 var(--edge-soft);
}

/* top HUD */
.hud { display: flex; flex-wrap: wrap; gap: 6px 20px; justify-content: space-between; align-items: center; font-family: var(--font-display); font-size: 13px; letter-spacing: .14em; text-transform: uppercase; }
.logo { display: flex; align-items: center; gap: 10px; color: var(--text); }
.logo svg { width: 22px; height: 22px; }
.live { display: flex; align-items: center; gap: 10px; color: var(--leaf); }
.dot { width: 10px; height: 10px; background: var(--leaf); animation: pulse 1.6s steps(2) infinite; }
@keyframes pulse { 50% { opacity: .3; } }

.layout { display: grid; gap: 20px; }
.side { display: grid; gap: 18px; align-content: start; min-width: 0; }

/* nameplate (top-left corner of the screen) */
.nameplate { padding: 16px 18px 18px; display: grid; gap: 4px; }
.np-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.label { font-family: var(--font-display); font-size: 12px; letter-spacing: .2em; color: var(--muted); text-transform: uppercase; padding-top: 6px; }
.lvl { display: flex; align-items: baseline; gap: 6px; background: var(--gold); color: var(--gold-ink); padding: 2px 12px 4px; font-family: var(--font-display); box-shadow: inset 0 -4px 0 0 var(--gold-deep); }
.lvl span { font-size: 13px; letter-spacing: .1em; }
.lvl b { font-size: 32px; line-height: 1.1; font-weight: 700; }
.nameplate h1 { font-family: var(--font-display); font-weight: 700; font-size: 34px; line-height: 1.1; }
.nameplate h1 small { font-size: 15px; font-weight: 400; color: var(--muted); letter-spacing: .04em; margin-left: 6px; }
.role { font-size: 16px; font-weight: 700; color: var(--gold); }
.xp { display: flex; align-items: center; gap: 6px; margin-top: 10px; }
.xp i { flex: 0 1 46px; height: 14px; background: var(--gold); box-shadow: inset 0 -4px 0 0 var(--gold-deep); }
.xp .plus { font-family: var(--font-display); font-size: 20px; line-height: 1; color: var(--gold); margin-left: 2px; }
.xp-cap { font-size: 13px; color: var(--muted); margin-top: 4px; }

/* portrait scene with visual-novel dialogue */
.scene { position: relative; }
.scene img { display: block; width: 100%; aspect-ratio: 1 / 1; object-fit: cover; object-position: 62% 40%; }
.dialog { position: absolute; inset: auto 12px 12px 12px; padding: 18px 20px 16px; background: rgba(26, 18, 16, .94); box-shadow: 0 -3px 0 0 var(--text), 0 3px 0 0 var(--text), -3px 0 0 0 var(--text), 3px 0 0 0 var(--text); }
.dialog .who { position: absolute; top: -15px; left: 14px; background: var(--gold); color: var(--gold-ink); font-family: var(--font-display); font-size: 12px; letter-spacing: .14em; padding: 2px 10px; }
.dialog p { font-size: 15px; line-height: 1.45; min-height: 4.35em; padding-right: 14px; }
.dialog::after { content: ""; position: absolute; right: 16px; bottom: 12px; border-top: 8px solid var(--gold); border-left: 6px solid transparent; border-right: 6px solid transparent; animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* menu */
.menu { padding: 16px; container-type: inline-size; min-width: 0; }
.tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px 8px; padding: 2px; margin-bottom: 20px; }
.tab { margin: 2px; padding: 11px 4px; text-align: center; font-family: var(--font-display); font-weight: 600; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; background: var(--panel-2); color: var(--text); box-shadow: 0 -2px 0 0 var(--edge-soft), 0 2px 0 0 var(--edge-soft), -2px 0 0 0 var(--edge-soft), 2px 0 0 0 var(--edge-soft); transition: background .12s; }
.tab:hover { background: var(--panel-3); }
.tab[aria-selected="true"] { background: var(--gold); color: var(--gold-ink); box-shadow: 0 -2px 0 0 var(--gold-deep), 0 2px 0 0 var(--gold-deep), -2px 0 0 0 var(--gold-deep), 2px 0 0 0 var(--gold-deep); }
.tab kbd { display: none; font: inherit; font-size: 10px; opacity: .65; margin-right: 6px; }
@media (hover: hover) and (min-width: 1020px) { .tab kbd { display: inline; } }
@container (min-width: 600px) {
  .tabs { grid-template-columns: repeat(6, 1fr); }
  .tab { font-size: 12px; letter-spacing: .03em; padding-inline: 2px; }
  .tab kbd { display: none; }
}

.pane { display: grid; gap: 24px; }
.group { display: grid; gap: 12px; min-width: 0; }
.h { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 600; font-size: 13px; letter-spacing: .16em; text-transform: uppercase; color: var(--gold); }
.h::before { content: ""; width: 8px; height: 8px; background: var(--gold); flex: none; }
.h::after { content: ""; flex: 1; border-top: 2px dashed var(--edge-soft); }
.hint { font-size: 13px; color: var(--muted); }

.grid2 { display: grid; gap: 14px; }
@container (min-width: 560px) { .grid2 { grid-template-columns: 1fr 1fr; } }
.card { padding: 16px; display: grid; gap: 8px; align-content: start; min-width: 0; }
.big { font-family: var(--font-display); font-weight: 700; font-size: 58px; line-height: 1; color: var(--gold); display: flex; align-items: baseline; gap: 10px; }
.big span { font-size: 20px; font-weight: 400; color: var(--text); }
.klass { font-family: var(--font-display); font-weight: 700; font-size: 24px; line-height: 1.15; }
.meta { font-size: 13px; color: var(--muted); }

/* chips */
.chips { display: flex; flex-wrap: wrap; gap: 10px; }
.chip { display: inline-flex; align-items: center; gap: 8px; min-height: 38px; margin: 2px; padding: 6px 12px; font-size: 14px; line-height: 1.2; color: var(--text); background: var(--panel-2); box-shadow: 0 -2px 0 0 var(--edge-soft), 0 2px 0 0 var(--edge-soft), -2px 0 0 0 var(--edge-soft), 2px 0 0 0 var(--edge-soft); transition: background .12s; }
.chip:hover { background: var(--panel-3); }
.chip[aria-pressed="true"] { background: var(--panel-3); box-shadow: 0 -2px 0 0 var(--gold), 0 2px 0 0 var(--gold), -2px 0 0 0 var(--gold), 2px 0 0 0 var(--gold); }
.chip[aria-pressed="true"]::before { content: ""; border-left: 6px solid var(--gold); border-top: 4px solid transparent; border-bottom: 4px solid transparent; }
.tag { display: inline-flex; align-items: center; margin: 2px; padding: 4px 10px; font-size: 13px; line-height: 1.25; color: var(--muted); background: var(--bg); box-shadow: 0 -2px 0 0 var(--edge-soft), 0 2px 0 0 var(--edge-soft), -2px 0 0 0 var(--edge-soft), 2px 0 0 0 var(--edge-soft); }

.readout { margin: 2px; padding: 14px 16px; background: var(--bg); box-shadow: 0 -2px 0 0 var(--edge-soft), 0 2px 0 0 var(--edge-soft), -2px 0 0 0 var(--edge-soft), 2px 0 0 0 var(--edge-soft); display: grid; gap: 4px; }
.readout h4 { font-family: var(--font-display); font-weight: 600; font-size: 16px; letter-spacing: .04em; color: var(--gold); }

/* result tiles + bars */
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.tile { margin: 2px; padding: 12px; display: grid; gap: 6px; align-content: start; min-width: 0; }
.tile .lbl { font-family: var(--font-display); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.tile .val { font-family: var(--font-display); font-weight: 700; font-size: 30px; line-height: 1; color: var(--c, var(--gold)); overflow-wrap: anywhere; }
.tile .cap { font-size: 13px; line-height: 1.35; }
.tile .src { font-size: 12px; color: var(--muted); }
.bar { height: 10px; background: var(--bg); box-shadow: 0 0 0 2px var(--edge-soft); margin: 2px 2px 0; }
.bar i { display: block; height: 100%; width: var(--fill); background-color: var(--c, var(--gold)); background-image: repeating-linear-gradient(90deg, transparent 0 8px, rgba(0, 0, 0, .3) 8px 10px); }
.pane.play .bar i { animation: fill .9s steps(10) both; }
@keyframes fill { from { width: 0; } }

.linkbtn { justify-self: start; font-family: var(--font-display); font-weight: 600; font-size: 14px; letter-spacing: .06em; color: var(--gold); padding: 6px 0; text-transform: uppercase; }
.linkbtn:hover { text-decoration: underline; text-underline-offset: 4px; }

/* quests */
.quests { display: grid; gap: 14px; }
.quest { padding: 0; min-width: 0; }
.q-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; width: 100%; padding: 14px 16px; }
.q-main { display: grid; gap: 2px; justify-items: start; min-width: 0; }
.q-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; margin-bottom: 4px; }
.q-per { font-size: 13px; color: var(--muted); }
.q-co { font-family: var(--font-display); font-weight: 700; font-size: 22px; line-height: 1.15; }
.q-role { font-size: 14px; color: var(--muted); }
.q-side { display: flex; align-items: center; gap: 12px; }
.q-key { font-family: var(--font-display); font-weight: 600; font-size: 14px; color: var(--gold); text-align: right; max-width: 11ch; line-height: 1.2; }
.chev { width: 10px; height: 10px; flex: none; border-right: 3px solid var(--gold); border-bottom: 3px solid var(--gold); transform: translateY(-3px) rotate(45deg); transition: transform .15s; }
.q-head[aria-expanded="true"] .chev { transform: translateY(2px) rotate(-135deg); }
.q-body { padding: 0 16px 16px; display: grid; gap: 12px; }
.loot { display: grid; gap: 8px; }
.loot li { position: relative; padding-left: 22px; font-size: 15px; }
.loot li::before { content: ""; position: absolute; left: 3px; top: .55em; width: 8px; height: 8px; background: var(--gold); transform: rotate(45deg); }
.state { display: inline-block; font-family: var(--font-display); font-weight: 600; font-size: 11px; letter-spacing: .14em; padding: 2px 8px; background: var(--leaf); color: var(--leaf-ink); }
.state.open { background: var(--gold); color: var(--gold-ink); }
.quest.next { margin: 2px; padding: 14px 16px; background: transparent; box-shadow: none; border: 2px dashed var(--gold); display: grid; gap: 8px; justify-items: start; }
.quest.next h3 { font-family: var(--font-display); font-weight: 700; font-size: 22px; line-height: 1.15; }
.side-quests { display: grid; gap: 12px; }
.sq { padding: 12px 16px; display: grid; gap: 4px; }
.sq h4 { font-family: var(--font-display); font-weight: 700; font-size: 18px; }
.sq .q-per { margin-bottom: 2px; }

.btn { display: inline-block; text-decoration: none; background: var(--gold); color: var(--gold-ink); font-family: var(--font-display); font-weight: 700; font-size: 15px; letter-spacing: .08em; text-transform: uppercase; padding: 12px 18px; box-shadow: inset 0 -4px 0 0 var(--gold-deep); transition: transform .08s; }
.btn:hover { transform: translateY(-2px); }
.btn:active { transform: translateY(2px); }

/* results */
.count { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.count .segs { display: flex; gap: 4px; }
.count .segs i { width: 16px; height: 10px; background: var(--leaf); }
.rgrid { display: grid; grid-template-columns: 1fr; gap: 12px; }
@container (min-width: 480px) { .rgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.rcard { margin: 2px; padding: 12px; display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 12px; align-items: start; background: var(--panel-2); box-shadow: 0 -2px 0 0 var(--edge-soft), 0 2px 0 0 var(--edge-soft), -2px 0 0 0 var(--edge-soft), 2px 0 0 0 var(--edge-soft); transition: background .12s; }
.rcard:hover { background: var(--panel-3); }
.rcard[aria-pressed="true"] { background: var(--panel-3); box-shadow: 0 -2px 0 0 var(--gold), 0 2px 0 0 var(--gold), -2px 0 0 0 var(--gold), 2px 0 0 0 var(--gold); }
.rcard svg { width: 40px; height: 40px; }
.rcard .rt { display: block; font-weight: 700; font-size: 14px; line-height: 1.3; }
.rcard .rm { display: block; font-family: var(--font-display); font-weight: 700; font-size: 19px; line-height: 1.15; color: var(--gold); margin-top: 2px; }
.rcard .rw { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }

/* skills extras */
.certs { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.cert { margin: 2px; padding: 10px 12px; display: grid; gap: 2px; align-content: start; min-width: 0; }
.cert b { font-size: 14px; line-height: 1.3; }
.cert span { font-size: 13px; color: var(--muted); }

/* contact */
.mission { margin: 2px; padding: 16px; border: 2px dashed var(--gold); display: grid; gap: 8px; }
.mission h3 { font-family: var(--font-display); font-weight: 700; font-size: 26px; line-height: 1.15; }
.contacts { display: grid; gap: 12px; }
.crow { padding: 12px 14px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; }
.crow .k { grid-column: 1 / -1; font-family: var(--font-display); font-weight: 600; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); }
.crow .val { overflow-wrap: anywhere; font-size: 16px; }
.crow a { color: var(--text); text-underline-offset: 3px; }
.mini { font-family: var(--font-display); font-weight: 600; font-size: 12px; letter-spacing: .08em; padding: 6px 10px; background: var(--panel); box-shadow: 0 -2px 0 0 var(--edge), 0 2px 0 0 var(--edge), -2px 0 0 0 var(--edge), 2px 0 0 0 var(--edge); }
.mini:hover { background: var(--panel-3); }

.keys { display: none; font-size: 13px; color: var(--muted); text-align: center; }
@media (hover: hover) and (min-width: 1020px) { .keys { display: block; } }

@media (min-width: 1020px) {
  .layout { grid-template-columns: minmax(0, 440px) minmax(0, 1fr); gap: 28px; align-items: start; }
  .side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); }
  .menu { padding: 20px; }
}
@media (max-width: 420px) {
  .nameplate h1 { font-size: 30px; }
  .dialog p { font-size: 14px; }
  .big { font-size: 50px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* Me conheça */
.bio { padding: 16px 18px; display: grid; gap: 14px; }
.bio p { font-size: 16px; line-height: 1.6; max-width: 62ch; overflow-wrap: anywhere; white-space: pre-line; }
.facts { margin: 2px; background: var(--bg); box-shadow: 0 -2px 0 0 var(--edge-soft), 0 2px 0 0 var(--edge-soft), -2px 0 0 0 var(--edge-soft), 2px 0 0 0 var(--edge-soft); }
.fact { display: grid; grid-template-columns: minmax(100px, 30%) minmax(0, 1fr); gap: 4px 16px; padding: 12px 14px; }
.fact + .fact { border-top: 2px dashed var(--edge-soft); }
.fact dt { font-family: var(--font-display); font-weight: 600; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); padding-top: 3px; overflow-wrap: anywhere; }
.fact dd { margin: 0; font-size: 15px; overflow-wrap: anywhere; white-space: pre-line; }
@container (max-width: 440px) { .fact { grid-template-columns: minmax(0, 1fr); } }

/* long texts written in the editor keep their line breaks */
.sq p, .readout p, .q-body > p { white-space: pre-line; overflow-wrap: anywhere; }

/* edit mode (owner only) */
.hud-r { display: flex; align-items: center; gap: 10px 18px; flex-wrap: wrap; }
.edit-btn { color: var(--gold); letter-spacing: .12em; padding: 8px 12px; }

.ed { position: fixed; inset: 0; z-index: 50; background: rgba(10, 6, 5, .9); display: grid; place-items: center; padding: calc(env(safe-area-inset-top, 0px) + 10px) 10px calc(env(safe-area-inset-bottom, 0px) + 10px); }
.ed-panel { width: min(780px, calc(100% - 8px)); max-height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; min-height: 0; }
.ed-head { padding: 16px 18px 10px; display: grid; gap: 4px; }
.ed-head h2 { font-family: var(--font-display); font-weight: 700; font-size: 24px; line-height: 1.15; }
.ed-head p { font-size: 14px; color: var(--muted); }
.ed-scroll { overflow: auto; padding: 8px 16px 18px; overscroll-behavior: contain; min-height: 0; }
.ed-foot { padding: 12px 16px; display: grid; gap: 10px; border-top: 2px dashed var(--edge-soft); }
.ed-msg { font-size: 14px; color: var(--muted); min-height: 1.4em; }
.ed-msg.err { color: var(--coral); }
.ed-msg.ok { color: var(--leaf); }
.ed-btns { display: flex; flex-wrap: wrap; justify-content: flex-end; align-items: center; gap: 12px; }
.btn[disabled] { opacity: .55; cursor: default; transform: none; }
.mini[disabled] { opacity: .4; cursor: default; }
.mini.danger { color: var(--coral); }
.mini[data-armed="1"] { background: var(--coral); color: var(--gold-ink); }

.sec { margin: 2px 2px 14px; background: var(--panel-2); box-shadow: 0 -2px 0 0 var(--edge-soft), 0 2px 0 0 var(--edge-soft), -2px 0 0 0 var(--edge-soft), 2px 0 0 0 var(--edge-soft); }
.sec > summary { padding: 13px 16px; cursor: pointer; list-style: none; font-family: var(--font-display); font-weight: 600; font-size: 14px; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); display: flex; align-items: center; gap: 10px; }
.sec > summary::-webkit-details-marker, .item > summary::-webkit-details-marker { display: none; }
.sec > summary::before, .item > summary::before { content: ""; border-left: 7px solid var(--gold); border-top: 5px solid transparent; border-bottom: 5px solid transparent; transition: transform .12s; flex: none; }
.sec[open] > summary::before, .item[open] > summary::before { transform: rotate(90deg); }
.sec-body { padding: 4px 16px 18px; display: grid; gap: 14px; }

.list { display: grid; gap: 10px; }
.item { background: var(--bg); box-shadow: 0 0 0 2px var(--edge-soft); margin: 2px; }
.item > summary { padding: 10px 12px; cursor: pointer; list-style: none; font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 10px; }
.item-body { padding: 4px 12px 14px; display: grid; gap: 12px; }
.item-act { display: flex; flex-wrap: wrap; gap: 8px; }
.mini.add { justify-self: start; color: var(--gold); }

.f { display: grid; gap: 4px; min-width: 0; }
.f > span { font-family: var(--font-display); font-weight: 600; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.f small { font-size: 13px; color: var(--muted); }
.f input[type="text"], .f input[type="number"], .f textarea, .f select { width: 100%; min-width: 0; background: var(--bg); color: var(--text); border: 2px solid var(--edge-soft); border-radius: 0; padding: 9px 10px; font: inherit; font-size: 15px; line-height: 1.4; }
.f textarea { resize: vertical; min-height: 80px; }
.f input:focus, .f textarea:focus, .f select:focus { outline: none; border-color: var(--gold); }
.row2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.chk { display: flex; align-items: flex-start; gap: 10px; font-size: 15px; cursor: pointer; }
.chk input { width: 18px; height: 18px; margin: 2px 0 0; accent-color: var(--gold); flex: none; }
.chk-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 8px 14px; }
.imgrow { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.thumb { width: 96px; height: 96px; object-fit: cover; object-position: 62% 40%; box-shadow: 0 0 0 2px var(--edge-soft); }
.filebtn { cursor: pointer; color: var(--gold); }
.filebtn:focus-within { outline: 3px dashed var(--gold); outline-offset: 3px; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); z-index: 40; width: min(560px, calc(100% - 32px)); background: var(--panel); box-shadow: 0 -3px 0 0 var(--gold), 0 3px 0 0 var(--gold), -3px 0 0 0 var(--gold), 3px 0 0 0 var(--gold); padding: 12px 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; font-size: 14px; }
.toast span { flex: 1 1 200px; }
</style>

nd: configuração, treinamento e pós-implementação.","Squad de qualidade para processos e materiais padronizados."],"tags":["MRR 600k","Retenção","Treinamentos"]},{"id":"2s","co":"2S Nutrição","role":"Analista de CX Jr.","per":"2020 a 2021","key":"150 clientes","sum":"Estruturação completa dos processos e atendimento de uma carteira B2C de 150 clientes, no modelo low touch.","loot":["Jornada do cliente completa, com touchpoints, indicadores e acompanhamento.","Processo de qualidade com Q&A, documentação e fluxos para cada canal.","Métricas de CSAT e análise de feedbacks para melhoria contínua.","Pós-venda com devoluções, atualizações e resolução proativa de problemas.","Base de conhecimento centralizada, que deu mais autonomia aos clientes."],"tags":["B2C","Low touch","CSAT"]}],"side":[{"id":"sq2","t":"Café com CS","per":"11/2023 a 09/2024","r":"Co-fundadora e community manager","d":"    • Criação de conteúdo para as redes sociais e WhatsApp da marca.\n    • Engajamento de comunidade.\n    • Estratégias e planejamento de conteúdo.\n    • Criação de materiais e cursos.\n    • Responsável por ministrar mentorias, aulas e eventos ao vivo.\n    • Acompanhamento e onboarding de membros PRO.\n    • Gerenciamento de plataforma de comunidade.\n    • Direcionamento de feedbacks da comunidade e ações de melhoria. \n    • Desenvolvimento de processos.\n    • Divulgações.\n    • Desenvolvimento de relacionamento e fidelização de membros.\n    • Participação ativa nas decisões e estratégias de negócio.\n    • Lançamento de comunidade."}],"contact":{"headline":"Customer Success Pleno (remota), Sênior (remota ou híbrida) ou especialista (remota ou híbrida)","text":"Enterprise & Key Accounts, B2B e B2C. Relacionamentos consultivos, retenção de receita e expansão com dados e IA.","base":"Base: Taubaté, SP","linkedin":"https://www.linkedin.com/in/thaliagoncalves","email":"thaliacrgoncalves@gmail.com","phone":"(12) 98120-2484"},"conheca":{"title":"Me conheça","text":"Oiii!\nSei que vocês vão perguntar algumas coisas na entrevista, mas gostaria de antecipar algumas coisinhas sobre mim!\n\nSou a Thalía, mas pode me chamar de Thali ou Lia, tenho 28 anos, crio conteúdo sobre CS no linkedin desde 2020, moro em Taubaté SP, trabalho desde os meus 16 anos com atendimento ao cliente e 5 anos com CS. Já tive alguns empreendimentos ao longo da vida, foi com eles que aprendi sobre atendimento, vendas, processos e principalmente, descobri que sou uma garota extremamente criativa. \n\nAmo criar relacionamentos que geram resultados, daqueles que existe tanta confiança que o cliente não pensa 2x antes de renovar, expandir e ficar.\n\nTenho estudado mais sobre o uso da IA na rotina de CS, faço terapia para lidar com os problemas e pressões do dia a dia e posso dizer que, um dos meus maiores defeitos (que melhorei consideravelmente, graças a terapia) é que, antes, eu era uma profissional que tinha muita dificuldade em dizer NÃO e hoje, consigo priorizar muito melhor as minhas demandas e fazer isso da forma certa, sem me sobrecarregar ou afetar meu trabalho negativamente.\n\nSou uma pessoa muito \"fofinha\" como dizem (haha) e engraçada. Então, farei questão de ser uma boa companhia para o time, mudando o clima e colocando as pessoas para cima! \n\nSou mentora de carreira em CS desde 2024 e, por esse motivo, gosto de impulsionar meus colegas, ajudá-los a serem melhores e a se destacarem. \n\nTenho uma cachorrinha (grandona) chamada Luna Maria e moro com o amor da minha vida (o Pedro). \u003c3 \n\nAmo escrever, jogar jogos fofos, romance (estou assistindo outlander) e vez ou outra, desenhar. \n\nMeu sonho é poder me tornar uma líder em CS um dia, me casar e falar inglês/francês fluentemente. \n\nE claro, encontrar um emprego bem gordinho e macio, em breve! ","facts":[{"id":"f1","k":"Base","v":"Taubaté, SP"},{"id":"f2","k":"Busco","v":"Customer Success Pleno (remota), Sênior (remota ou híbrida) ou Especialista (remota ou híbrida)"},{"id":"f4","k":"Item especial","v":"Poção de senso de humor ruim. Te faz rir de piadas ruins, mesmo que não façam sentido algum!"}]}}</script>
<script id="app-script">(function () {
  'use strict';
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function uid(p) { return p + Math.random().toString(36).slice(2, 8); }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function safeUrl(u) {
    u = String(u || '').trim();
    if (!u) return '#';
    return /^https?:\/\//i.test(u) ? u : 'https://' + u.replace(/^[a-z]+:\/*/i, '');
  }

  var TITLE = 'Thalía CS Quest';
  var HEAD_LINKS = '<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Pixelify+Sans:wght@400;600;700&display=swap">';
  var RESET = ':root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}';
  var KEY = 'cs-quest-draft';

  var DATA = JSON.parse($('#page-data').textContent);
  (function migrate(D) {
    D.say = D.say || {};
    if (!D.say.conheca) D.say.conheca = 'Quer me conhecer um pouco melhor? Dá uma olhada na minha ficha.';
    if (!D.conheca) D.conheca = { title: 'Me conheça', text: '', facts: [] };
    D.conheca.facts = D.conheca.facts || [];
  })(DATA);
  var reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  var ORDER = ['status', 'skills', 'missoes', 'resultados', 'conheca', 'contato'];
  var TABS = { status: 'Status', skills: 'Skills', missoes: 'Missões', resultados: 'Resultados', conheca: 'Me conheça', contato: 'Contato' };

  /* ---------- pixel sprites (8x8) ---------- */
  var SPR = {
    shield: ['++++++++', '+######+', '+######+', '+######+', '.+####+.', '.+####+.', '..+##+..', '...++...'],
    heart: ['.##..##.', '########', '#+######', '########', '.######.', '..####..', '...##...', '........'],
    down: ['..####..', '..####..', '..####..', '..####..', '########', '.######.', '..####..', '...##...'],
    gear: ['...##...', '.#.##.#.', '..####..', '###..###', '###..###', '..####..', '.#.##.#.', '...##...'],
    crown: ['........', '#..##..#', '##.##.##', '########', '########', '#+####+#', '########', '........'],
    star: ['...##...', '...##...', '########', '.######.', '..####..', '.######.', '.##..##.', '.#....#.']
  };
  var SPRCOL = { shield: 'var(--leaf)', heart: 'var(--coral)', down: 'var(--leaf)', gear: 'var(--gold)', crown: 'var(--gold)', star: 'var(--gold)' };
  var SPRLBL = { shield: 'Escudo', heart: 'Coração', down: 'Seta para baixo', gear: 'Engrenagem', crown: 'Coroa', star: 'Estrela' };
  function sprite(k) {
    var g = SPR[k] || SPR.star, c = SPRCOL[k] || 'var(--gold)', out = '';
    g.forEach(function (row, y) {
      for (var x = 0; x < row.length; x++) {
        var ch = row.charAt(x);
        if (ch === '#') out += '<rect x="' + x + '" y="' + y + '" width="1" height="1" style="fill:' + c + '"/>';
        else if (ch === '+') out += '<rect x="' + x + '" y="' + y + '" width="1" height="1" style="fill:var(--text)"/>';
      }
    });
    return '<svg viewBox="0 0 8 8" shape-rendering="crispEdges" aria-hidden="true">' + out + '</svg>';
  }

  /* ---------- page markup, generated from DATA ---------- */
  function statusPane(D) {
    var S = D.status;
    var eq = D.skills.filter(function (s) { return (S.equipped || []).indexOf(s.id) > -1; });
    var tiles = D.results.filter(function (r) { return r.tile && r.tVal; });
    var h = '<section class="pane" id="p-status" role="tabpanel" aria-labelledby="t-status" tabindex="0">';
    h += '<div class="grid2">' +
      '<article class="card px2"><h2 class="h">Experiência</h2><p class="big">' + esc(S.expNumber) + '<span>' + esc(S.expUnit) + '</span></p><p>' + esc(S.expText) + '</p><p class="meta">' + esc(S.expMeta) + '</p></article>' +
      '<article class="card px2"><h2 class="h">Classe</h2><p class="klass">' + esc(S.klass) + '</p><p>' + esc(S.klassText) + '</p><p class="meta">' + esc(S.klassMeta) + '</p></article></div>';
    if (eq.length) {
      h += '<div class="group"><h2 class="h">Skills equipadas</h2><div class="chips">' +
        eq.map(function (s) { return '<button type="button" class="chip" data-eq="' + esc(s.id) + '">' + esc(s.label) + '</button>'; }).join('') +
        '</div><p class="hint">Toque em uma skill para ver onde eu usei.</p></div>';
    }
    if (tiles.length || D.results.length) {
      h += '<div class="group"><h2 class="h">Resultados</h2>';
      if (tiles.length) {
        h += '<div class="tiles">' + tiles.map(function (r) {
          var f = Math.max(0, Math.min(100, Number(r.fill) || 0));
          return '<article class="tile px2" style="--c:' + (SPRCOL[r.spr] || 'var(--gold)') + ';--fill:' + f + '%">' +
            '<p class="lbl">' + esc(r.tLbl) + '</p><p class="val">' + esc(r.tVal) + '</p><p class="cap">' + esc(r.tCap) + '</p>' +
            '<div class="bar" aria-hidden="true"><i></i></div><p class="src">' + esc(r.where) + '</p></article>';
        }).join('') + '</div>';
      }
      if (D.results.length) h += '<button class="linkbtn" type="button" data-goto="resultados">Ver as ' + D.results.length + ' conquistas &rarr;</button>';
      h += '</div>';
    }
    return h + '</section>';
  }

  function skillsPane(D) {
    var h = '<section class="pane" id="p-skills" role="tabpanel" aria-labelledby="t-skills" tabindex="0" hidden>';
    if (D.skills.length) {
      h += '<div class="group"><h2 class="h">Habilidades</h2><div class="chips" id="skill-chips">' +
        D.skills.map(function (s) { return '<button type="button" class="chip" data-skill="' + esc(s.id) + '" aria-pressed="false">' + esc(s.label) + '</button>'; }).join('') +
        '</div><div class="readout" id="skill-readout" aria-live="polite"></div></div>';
    }
    if (D.tools.length) {
      h += '<div class="group"><h2 class="h">Equipamento</h2><div class="chips">' +
        D.tools.map(function (t) { return '<span class="tag">' + esc(t) + '</span>'; }).join('') + '</div></div>';
    }
    if (D.certs.length || D.certsMore) {
      h += '<div class="group"><h2 class="h">Selos de certificação</h2>';
      if (D.certs.length) h += '<div class="certs">' + D.certs.map(function (c) { return '<div class="cert px2"><b>' + esc(c.name) + '</b><span>' + esc(c.issuer) + '</span></div>'; }).join('') + '</div>';
      if (D.certsMore) h += '<p class="hint">' + esc(D.certsMore) + '</p>';
      h += '</div>';
    }
    return h + '</section>';
  }

  function questsPane(D) {
    var h = '<section class="pane" id="p-missoes" role="tabpanel" aria-labelledby="t-missoes" tabindex="0" hidden><div class="quests">';
    h += '<article class="quest next"><span class="state open">EM ABERTO</span><h3>' + esc(D.next.title) + '</h3><p>' + esc(D.next.text) + '</p>' +
      '<button class="btn" type="button" data-goto="contato">Aceitar missão</button></article>';
    h += '<div class="quests">' + D.quests.map(function (q, i) {
      var open = i === 0;
      return '<article class="quest px2">' +
        '<button type="button" class="q-head" aria-expanded="' + open + '" aria-controls="qb-' + esc(q.id) + '">' +
          '<span class="q-main"><span class="q-meta"><span class="state">CONCLUÍDA</span><span class="q-per">' + esc(q.per) + '</span></span>' +
          '<span class="q-co">' + esc(q.co) + '</span><span class="q-role">' + esc(q.role) + '</span></span>' +
          '<span class="q-side"><span class="q-key">' + esc(q.key) + '</span><span class="chev" aria-hidden="true"></span></span>' +
        '</button>' +
        '<div class="q-body" id="qb-' + esc(q.id) + '"' + (open ? '' : ' hidden') + '>' +
          (q.sum ? '<p>' + esc(q.sum) + '</p>' : '') +
          (q.loot.length ? '<h3 class="h">Recompensas</h3><ul class="loot">' + q.loot.map(function (l) { return '<li>' + esc(l) + '</li>'; }).join('') + '</ul>' : '') +
          (q.tags.length ? '<div class="chips">' + q.tags.map(function (t) { return '<span class="tag">' + esc(t) + '</span>'; }).join('') + '</div>' : '') +
        '</div></article>';
    }).join('') + '</div></div>';
    if (D.side.length) {
      h += '<div class="group"><h2 class="h">Missões paralelas</h2><div class="side-quests">' + D.side.map(function (s) {
        return '<article class="sq px2"><p class="q-per">' + esc(s.per) + '</p><h4>' + esc(s.t) + '</h4><p class="q-role">' + esc(s.r) + '</p><p>' + esc(s.d) + '</p></article>';
      }).join('') + '</div></div>';
    }
    return h + '</section>';
  }

  function resultsPane(D) {
    var n = D.results.length, segs = '';
    for (var i = 0; i < n; i++) segs += '<i></i>';
    var h = '<section class="pane" id="p-resultados" role="tabpanel" aria-labelledby="t-resultados" tabindex="0" hidden><div class="group">';
    h += '<p class="count"><span>' + n + '/' + n + ' conquistas</span><span class="segs" aria-hidden="true">' + segs + '</span></p>';
    h += '<div class="rgrid" id="rgrid">' + D.results.map(function (r) {
      return '<button type="button" class="rcard" data-result="' + esc(r.id) + '" aria-pressed="false">' + sprite(r.spr) +
        '<span><span class="rt">' + esc(r.title) + '</span><span class="rm">' + esc(r.metric) + '</span><span class="rw">' + esc(r.where) + '</span></span></button>';
    }).join('') + '</div><div class="readout" id="result-readout" aria-live="polite"></div></div></section>';
    return h;
  }

  function conhecaPane(D) {
    var C = D.conheca;
    var paras = String(C.text || '').split(/\n\s*\n/).map(function (x) { return x.trim(); }).filter(Boolean);
    var facts = (C.facts || []).filter(function (f) { return f.k || f.v; });
    var h = '<section class="pane" id="p-conheca" role="tabpanel" aria-labelledby="t-conheca" tabindex="0" hidden>';
    if (paras.length) {
      h += '<div class="group"><h2 class="h">' + esc(C.title) + '</h2><div class="bio px2">' +
        paras.map(function (p) { return '<p>' + esc(p) + '</p>'; }).join('') + '</div></div>';
    }
    if (facts.length) {
      h += '<div class="group"><h2 class="h">Ficha da personagem</h2><dl class="facts">' +
        facts.map(function (f) { return '<div class="fact"><dt>' + esc(f.k) + '</dt><dd>' + esc(f.v) + '</dd></div>'; }).join('') + '</dl></div>';
    }
    if (!paras.length && !facts.length) h += '<p class="hint">Esta aba ainda está em branco.</p>';
    h += '<div><button type="button" class="mini" id="edit-conheca" hidden>EDITAR ESTA ABA</button></div></section>';
    return h;

  function contactPane(D) {
    var C = D.contact, href = safeUrl(C.linkedin), shown = String(C.linkedin || '').replace(/^https?:\/\/(www\.)?/i, '').replace(/\/$/, '');
    var h = '<section class="pane" id="p-contato" role="tabpanel" aria-labelledby="t-contato" tabindex="0" hidden>';
    h += '<div class="mission"><span class="state open">NOVA MISSÃO</span><h3>' + esc(C.headline) + '</h3><p>' + esc(C.text) + '</p>' + (C.base ? '<p class="meta">' + esc(C.base) + '</p>' : '') + '</div>';
    h += '<div class="contacts">';
    if (C.linkedin) h += '<div class="crow px2"><span class="k">LinkedIn</span><span class="val"><a href="' + esc(href) + '" target="_blank" rel="noopener">' + esc(shown) + '</a></span></div>';
    if (C.email) h += '<div class="crow px2"><span class="k">E-mail</span><span class="val">' + esc(C.email) + '</span><button class="mini" type="button" data-copy="' + esc(C.email) + '">COPIAR</button></div>';

    h += '</div>';
    if (C.linkedin) h += '<div><a class="btn" href="' + esc(href) + '" target="_blank" rel="noopener">Chamar no LinkedIn</a></div>';
    return h + '</section>';
  }

  function appHTML(D) {
    var P = D.profile, xp = '', i;
    for (i = 0; i < P.xpBlocks; i++) xp += '<i></i>';

    var tabs = ORDER.map(function (k, n) {
      return '<button class="tab" role="tab" id="t-' + k + '" aria-controls="p-' + k + '" aria-selected="' + (n === 0) + '"' + (n ? ' tabindex="-1"' : '') + ' aria-keyshortcuts="' + (n + 1) + '"><kbd aria-hidden="true">' + (n + 1) + '</kbd>' + TABS[k] + '</button>';
    }).join('');
    return '<div class="stage">' +
      '<div class="hud"><p class="logo"><svg viewBox="0 0 8 8" shape-rendering="crispEdges" aria-hidden="true"><path d="M3 0h2v1h1v1h1v2H6v1H5v1H3V5H2V4H1V2h1V1h1z" style="fill:var(--gold)"/><path d="M3 2h2v2H3z" style="fill:var(--bg)"/></svg>' + esc(D.hud.logo) + '</p>' +
      '<div class="hud-r"><p class="live"><i class="dot" aria-hidden="true"></i>' + esc(D.hud.live) + '</p><button type="button" class="mini edit-btn" id="edit-btn" hidden>EDITAR</button></div></div>' +
      '<div class="layout"><aside class="side">' +
        '<header class="nameplate px"><div class="np-row"><p class="label">' + esc(P.label) + '</p><p class="lvl" aria-label="Nível ' + esc(P.level) + '"><span>LVL</span><b>' + esc(P.level) + '</b></p></div>' +
        '<h1>' + esc(P.name) + (P.surname ? '<small>' + esc(P.surname) + '</small>' : '') + '</h1><p class="role">' + esc(P.role) + '</p>' +
        '<div class="xp" role="img" aria-label="' + esc(P.xpCaption) + '">' + xp + '</div><p class="xp-cap">' + esc(P.xpCaption) + '</p></header>' +

  function copyText(text, btn) {

    function fallback() {
      var el = btn.parentElement.querySelector('.val');
      var r = document.createRange();
      r.selectNodeContents(el);
      var s = window.getSelection();
      s.removeAllRanges();
      s.addRange(r);
      done('SELECIONADO');
    }
    try {
      navigator.clipboard.writeText(text).then(function () { done('COPIADO'); }, fallback);

  }

  function renderEditor() {
    var sc = $('#ed-scroll'), top = sc.scrollTop;
    sc.innerHTML = editorBody();
    sc.scrollTop = top;
  }

  function onInput(e) {
    var t = e.target;
    if (t.id === 'ed-file') { onFile(t); return; }
    if (t.hasAttribute('data-eqid')) {
      var ids = ED.draft.status.equipped, id = t.getAttribute('data-eqid'), i = ids.indexOf(id);
      if (t.checked && i < 0) ids.push(id);
      if (!t.checked && i > -1) ids.splice(i, 1);
      ED.dirty = true; msg('');
      return;
    }
    var p = t.getAttribute('data-p');
    if (!p) return;
    var kind = t.getAttribute('data-t'), v;
    if (kind === 'num') {
      v = Number(t.value);
      if (t.value === '' || !isFinite(v)) return;
      v = Math.min(Number(t.max), Math.max(Number(t.min), v));
    } else if (kind === 'bool') {
      v = t.checked;
    } else if (kind === 'lines') {
      v = t.value.split('\n').map(function (x) { return x.trim(); }).filter(Boolean);
    } else {
      v = t.value;
    }
    setP(ED.draft, p, v);
    ED.dirty = true;
    msg('');
    if (t.hasAttribute('data-sum')) {
      var det = t.closest('details.item');
      if (det) det.querySelector('summary').textContent = t.value || '(sem título)';
    }
  }

  function onClick(e) {
    var b = e.target.closest('button');
    if (!b) return;
    var act = b.getAttribute('data-act');
    if (!act) return;
    var path = b.getAttribute('data-path'), arr = getP(ED.draft, path), i = Number(b.getAttribute('data-i')), tmp;
    if (act === 'up' && i > 0) { tmp = arr[i - 1]; arr[i - 1] = arr[i]; arr[i] = tmp; }
    else if (act === 'down' && i < arr.length - 1) { tmp = arr[i + 1]; arr[i + 1] = arr[i]; arr[i] = tmp; }
    else if (act === 'del') {
      if (b.getAttribute('data-armed') !== '1') {
        b.setAttribute('data-armed', '1');
        b.textContent = 'CONFIRMAR?';
        setTimeout(function () { if (b.isConnected) { b.removeAttribute('data-armed'); b.textContent = 'REMOVER'; } }, 3000);
        return;
      }
      var gone = arr.splice(i, 1)[0];
      if (path === 'skills') ED.draft.status.equipped = ED.draft.status.equipped.filter(function (x) { return x !== gone.id; });
    } else if (act === 'add') {
      var it = NEW[path]();
      arr.push(it);
      ED.open[path + '#' + it.id] = true;
    } else { return; }
    ED.dirty = true;
    msg('');
    renderEditor();
  }

  function onToggle(e) {
    var d = e.target;
    if (!d || d.tagName !== 'DETAILS') return;
    var k = d.getAttribute('data-k');
    if (!k) return;
    if (d.open) ED.open[k] = true; else delete ED.open[k];
  }

  function onFile(input) {
    var f = input.files && input.files[0];
    if (!f) return;
    if (!/^image\//.test(f.type)) { msg('Escolha um arquivo de imagem.', 'err'); return; }
    var rd = new FileReader();
    rd.onload = function () {
      var im = new Image();
      im.onload = function () {
        var s = Math.min(1, 1000 / Math.max(im.width, im.height));
        var w = Math.max(1, Math.round(im.width * s)), h = Math.max(1, Math.round(im.height * s));
        var c = document.createElement('canvas');
        c.width = w; c.height = h;
        var x = c.getContext('2d');
        x.fillStyle = '#ffffff';
        x.fillRect(0, 0, w, h);
        x.drawImage(im, 0, 0, w, h);
        var url;
        try { url = c.toDataURL('image/jpeg', 0.85); } catch (err) { msg('Não consegui processar essa imagem.', 'err'); return; }
        ED.draft.image = url;
        ED.dirty = true;
        $('#ed-thumb').src = url;
        msg('Imagem trocada. Salve para publicar.', 'ok');
      };
      im.onerror = function () { msg('Não consegui abrir essa imagem.', 'err'); };
      im.src = rd.result;
    };
    rd.readAsDataURL(f);
  }

  function save() {
    var btn = $('#ed-save');
    btn.disabled = true;
    msg('Salvando…');
    try { sessionStorage.setItem(KEY, JSON.stringify(ED.draft)); } catch (e) { /* storage may be blocked */ }
    var html;
    try { html = buildDoc(ED.draft); } catch (e) { msg('Não consegui montar a página.', 'err'); btn.disabled = false; return; }
    ARTIFACT.publish(html).then(function () {
      msg('Salvo. Atualizando a página…', 'ok');
    }, function (err) {
      btn.disabled = false;
      var c = err && err.code;
      if (c === 'conflict') msg('Outra versão foi publicada enquanto você editava. A página vai recarregar e o seu rascunho fica guardado para recuperar.', 'err');
      else if (c === 'not_writer' || c === 'not_granted' || c === 'consent_required' || c === 'capability_disabled' || c === 'capability_removed' || c === 'not_declared') msg('Esta visualização não tem permissão para salvar.', 'err');
      else if (c === 'too_large') msg('A página ficou grande demais. Troque a imagem por uma menor.', 'err');
      else if (c === 'rate_limited') msg('Muitas gravações seguidas. Espere um instante e tente de novo.', 'err');
      else msg('Não foi possível salvar agora. Tente de novo em instantes.', 'err');
    });
  }

  function closeEditor() {
    var r = $('#editor');
    if (r) r.remove();
    $('#app').inert = false;
    document.body.style.overflow = '';
    ED = null;
    var b = $('#edit-btn');
    if (b) b.focus();
  }

  function openEditor(start, focusKey) {
    if (ED || !ARTIFACT) return;
    ED = { draft: clone(start || DATA), open: focusKey ? {} : { 'sec:perfil': true }, dirty: !!start };
    if (focusKey) ED.open[focusKey] = true;
    var root = document.createElement('div');
    root.id = 'editor';
    root.className = 'ed';
    root.setAttribute('role', 'dialog');
    root.setAttribute('aria-modal', 'true');
    root.setAttribute('aria-labelledby', 'ed-title');
    root.innerHTML = '<div class="ed-panel px"><div class="ed-head"><h2 id="ed-title">Editar a página</h2><p>Só você vê este botão. As mudanças aparecem para todo mundo depois que você salvar.</p></div>' +
      '<div class="ed-scroll" id="ed-scroll"></div>' +
      '<div class="ed-foot"><p class="ed-msg" id="ed-msg" role="status"></p><div class="ed-btns"><button type="button" class="mini" id="ed-cancel">CANCELAR</button><button type="button" class="btn" id="ed-save">Salvar alterações</button></div></div></div>';
    document.body.appendChild(root);
    $('#app').inert = true;
    document.body.style.overflow = 'hidden';
    renderEditor();
    root.addEventListener('input', onInput);
    root.addEventListener('change', onInput);
    root.addEventListener('click', onClick);
    root.addEventListener('toggle', onToggle, true);
    function tryClose() {
      var c = $('#ed-cancel');
      if (!ED.dirty) { closeEditor(); return; }
      if (c.getAttribute('data-armed') !== '1') {
        c.setAttribute('data-armed', '1');
        c.textContent = 'DESCARTAR AS MUDANÇAS?';
        setTimeout(function () { if (c.isConnected) { c.removeAttribute('data-armed'); c.textContent = 'CANCELAR'; } }, 4000);
        return;
      }
      try { sessionStorage.removeItem(KEY); } catch (e) { /* ignore */ }
      closeEditor();
    }
    root.addEventListener('keydown', function (e) { if (e.key === 'Escape') { e.preventDefault(); tryClose(); } });
    $('#ed-cancel').addEventListener('click', tryClose);
    $('#ed-save').addEventListener('click', save);
    var sect = focusKey ? $('#ed-scroll details[data-k="' + focusKey + '"]') : null;
    if (sect) {
      sect.scrollIntoView({ block: 'start' });
      var ta = sect.querySelector('textarea');
      if (ta) ta.focus({ preventScroll: true });
    } else {
      var first = $('#ed-scroll input[type="text"]');
      if (first) first.focus();
    }
  }

  function offerDraft() {
    var raw = null;
    try { raw = sessionStorage.getItem(KEY); } catch (e) { return; }
    if (!raw) return;
    if (raw === JSON.stringify(DATA)) { try { sessionStorage.removeItem(KEY); } catch (e) { /* ignore */ } return; }
    var t = document.createElement('div');
    t.className = 'toast';
    t.id = 'draft-toast';
    t.setAttribute('role', 'status');
    t.innerHTML = '<span>Há alterações que não foram salvas da última vez.</span><button type="button" class="mini" data-toast="restore">RECUPERAR</button><button type="button" class="mini" data-toast="discard">DESCARTAR</button>';
    document.body.appendChild(t);
    t.addEventListener('click', function (e) {
      var b = e.target.closest('button');
      if (!b) return;
      var what = b.getAttribute('data-toast');
      t.remove();
      if (what === 'restore') { try { openEditor(JSON.parse(raw)); } catch (err) { /* ignore */ } }
      else { try { sessionStorage.removeItem(KEY); } catch (err) { /* ignore */ } }
    });
  }

  function gate() {
    if (!window.claude || typeof window.claude.use !== 'function') return;
    Promise.all([window.claude.use('user'), window.claude.use('artifact')]).then(function (r) {
      var user = r[0], art = r[1];
      if (!user || !art) return null;
      return Promise.resolve(user.isOwner()).then(function (own) {
        if (!own) return;
        ARTIFACT = art;
        ['#edit-btn', '#edit-conheca'].forEach(function (sel) {
          var b = $(sel);
          if (b) b.hidden = false;
        });
        offerDraft();
      });
    }).catch(function () { /* read-only view */ });
  }

  /* ---------- boot ---------- */
  $('#app').innerHTML = appHTML(DATA);
  if (DATA.skills.length) selectSkill(DATA.skills[0].id);
  if (DATA.results.length) selectResult(DATA.results[0].id);

  $('#app').addEventListener('click', function (e) {
    var t = e.target.closest('[role="tab"]');
    if (t) { show(t.id.replace('t-', '')); return; }
    var b = e.target.closest('button');
    if (!b) return;
    if (b.id === 'edit-btn') { openEditor(); return; }
    if (b.id === 'edit-conheca') { openEditor(null, 'sec:conheca'); return; }
    if (b.hasAttribute('data-eq')) { show('skills'); selectSkill(b.getAttribute('data-eq')); return; }
    if (b.hasAttribute('data-skill')) { selectSkill(b.getAttribute('data-skill')); return; }
    if (b.hasAttribute('data-result')) { selectResult(b.getAttribute('data-result')); return; }
    if (b.hasAttribute('data-goto')) { show(b.getAttribute('data-goto')); return; }
    if (b.hasAttribute('data-copy')) { copyText(b.getAttribute('data-copy'), b); return; }
    if (b.classList.contains('q-head')) {
      var willOpen = b.getAttribute('aria-expanded') !== 'true';
      $$('.q-head').forEach(function (h) {
        var open = h === b && willOpen;
        h.setAttribute('aria-expanded', String(open));
        $('#' + h.getAttribute('aria-controls')).hidden = !open;
      });
    }
  });
  $('#app').addEventListener('keydown', function (e) {
    if (!e.target.closest('.tabs')) return;
    var i = ORDER.indexOf(current()), n = null;
    if (e.key === 'ArrowRight') n = (i + 1) % ORDER.length;
    else if (e.key === 'ArrowLeft') n = (i + ORDER.length - 1) % ORDER.length;
    else if (e.key === 'Home') n = 0;
    else if (e.key === 'End') n = ORDER.length - 1;
    if (n !== null) { e.preventDefault(); show(ORDER[n], { focus: true }); }
  });
  document.addEventListener('keydown', function (e) {
    if (ED || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.target.closest && e.target.closest('input, textarea, select, [contenteditable]')) return;
    var n = parseInt(e.key, 10);
    if (n >= 1 && n <= ORDER.length) show(ORDER[n - 1]);
  });

  gate();
})();
</script>
</body>
</html>
